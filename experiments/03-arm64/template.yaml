AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Resources:
  Slide06X86:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lazytown-slide06-x86
      Runtime: python3.13
      Handler: app.lambda_handler
      CodeUri: src/
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 10

  Slide06ARM:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lazytown-slide06-arm64
      Runtime: python3.13
      Handler: app.lambda_handler
      CodeUri: src/
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 10
